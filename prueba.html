<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POWER DASH:</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins/dist/rexvirtualjoystickplugin.min.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { margin: 0; background: #011C26; overflow: hidden; font-family: 'Montserrat', sans-serif; height: 100dvh; width: 100vw; }
        #game-container { width: 100vw; height: 100dvh; display: flex; justify-content: center; align-items: center; }
        
        /* HUD Modificado para que siempre esté centrado y alineado con el juego */
        .hud { 
            position: absolute; 
            top: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 95%; 
            max-width: 750px; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            color: white; 
            z-index: 20; 
            font-weight: bold; 
            pointer-events: none; 
            text-shadow: 0 0 5px #1DB6F2; 
        }
        
        #pause-btn-hud { pointer-events: auto; cursor: pointer; font-size: 1.5rem; background: rgba(1, 28, 38, 0.6); border: 2px solid #1DB6F2; border-radius: 8px; padding: 5px 15px; backdrop-filter: blur(5px); transition: transform 0.2s; display: none; }
        #pause-btn-hud:active { transform: scale(0.8); }

        @keyframes slideInBlur {
            from { opacity: 0; transform: translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        @keyframes fadeOutZoom {
            from { opacity: 1; transform: scale(1); filter: blur(0); }
            to { opacity: 0; transform: scale(1.2); filter: blur(5px); visibility: hidden; }
        }
        @keyframes neonPulse {
            0% { box-shadow: 0 0 10px #1DB6F2, inset 0 0 5px #1DB6F2; }
            50% { box-shadow: 0 0 20px #1DB6F2, inset 0 0 10px #1DB6F2; }
            100% { box-shadow: 0 0 10px #1DB6F2, inset 0 0 5px #1DB6F2; }
        }
        @keyframes recordPulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 15px #FFD700; opacity: 1; }
            50% { transform: scale(1.05); text-shadow: 0 0 25px #FFF, 0 0 30px #FFD700; opacity: 0.8; }
        }
        @keyframes textFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); text-shadow: 0 0 25px #1DB6F2, 0 0 15px #fff; }
        }
        @keyframes dropInCascade {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popInBounce {
            0% { opacity: 0; transform: scale(0.8); }
            70% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .overlay { 
    position: absolute; inset: 0; background: rgba(1, 28, 38, 0.9); backdrop-filter: blur(12px); 
    display: flex; flex-direction: column; justify-content: center; align-items: center; 
    gap: 6px;
            color: white; z-index: 40; text-align: center; padding: 15px; box-sizing: border-box; border: 2px solid rgba(29, 182, 242, 0.3);
            overflow-y: auto; 
        }
        .hidden { display: none !important; }
        
        #start-screen { animation: slideInBlur 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .transition-out { animation: fadeOutZoom 0.45s ease-in forwards !important; pointer-events: none; }
        
        .ellit-logo { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; margin-bottom: 5px; text-shadow: 0 0 15px #1DB6F2, 0 0 5px #fff; animation: textFloat 3s ease-in-out infinite; color: #1DB6F2; letter-spacing: 2px; }
        
        /* === NUEVO CSS PARA EL TUTORIAL CON IMÁGENES === */
#tutorial-box { 
    width: 100%; 
    max-width: 650px; 
    margin: 4px 0;
    padding: 5px;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    background: rgba(1,28,38,0.45);
    border-radius: 12px;
}

#tutorial-box img { 
    width: 100%; 
    max-width: 520px;
    height: auto; 
    border-radius: 10px; 
    box-shadow: 0 0 15px rgba(29, 182, 242, 0.4); 
    border: 1px solid rgba(29, 182, 242, 0.5); 
}

#tutorial-msg { 
    margin-top: 6px; 
    font-family: 'Montserrat', sans-serif; 
    font-size: 0.95rem; 
    font-weight: 700; 
    color: #ffffff; 
    text-align: center; 
    text-shadow: 0 0 8px #1DB6F2; 
    max-width: 95%; 
}

/* AJUSTES SOLO PARA CELULAR */
@media (max-width: 767px){

    #start-screen.overlay{
        justify-content: flex-start;
        padding-top: 230px;
        gap: 6px;
    }



    #tutorial-box{
        margin: 4px 0;
        padding: 5px;
        max-width: 95%;
    }

    #tutorial-box img{
        max-width: 100%;
    }

    #tutorial-msg{
        margin-top: 4px;
    }

}

        .slider-container { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 10px; width: 80%; max-width: 350px; margin-left: auto; margin-right: auto; pointer-events: auto; }
        .slider-container label { color: #1DB6F2; font-family: 'Orbitron', sans-serif; margin-bottom: 5px; text-shadow: 0 0 5px #1DB6F2; font-size: 0.85rem; letter-spacing: 1px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #fff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px #1DB6F2; border: 2px solid #1DB6F2; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: rgba(3, 166, 166, 0.3); border-radius: 3px; border: 1px solid #1DB6F2; }

        button { pointer-events: auto; width: 80%; max-width: 350px; padding: 14px; font-size: 1.1rem; font-weight: 900; color: white; background: rgba(3, 44, 166, 0.6); border: 2px solid #1DB6F2; border-radius: 6px; cursor: pointer; margin-top: 5px; box-shadow: 0 0 10px #1DB6F2; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px; backdrop-filter: blur(4px); font-family: 'Montserrat', sans-serif; }
        button:hover { background: rgba(3, 44, 166, 0.9); box-shadow: 0 0 25px #1DB6F2, inset 0 0 10px #1DB6F2; transform: scale(1.05); }
        button:active { transform: scale(0.95); box-shadow: 0 0 5px #1DB6F2; }
        
        .btn-secondary { border-color: #03A6A6; background: rgba(3, 166, 166, 0.2); box-shadow: 0 0 10px #03A6A6; }
        .btn-secondary:hover { background: rgba(3, 166, 166, 0.5); box-shadow: 0 0 20px #03A6A6, inset 0 0 10px #03A6A6; }

        #start-screen button { animation: neonPulse 2s infinite; }

        .pause-item { opacity: 0; }
        .animate-cascade .pause-item { animation: dropInCascade 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .animate-cascade h2.pause-item { animation-delay: 0.1s; }
        .animate-cascade .slider-container.pause-item:nth-of-type(1) { animation-delay: 0.2s; }
        .animate-cascade .slider-container.pause-item:nth-of-type(2) { animation-delay: 0.3s; }
        .animate-cascade button.pause-item:nth-of-type(1) { animation-delay: 0.4s; }
        .animate-cascade button.pause-item:nth-of-type(2) { animation-delay: 0.5s; }
        .animate-cascade button.pause-item:nth-of-type(3) { animation-delay: 0.6s; }

        .pop-in-anim { animation: popInBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        #new-record-msg { color: #FFD700; font-family: 'Orbitron', sans-serif; margin-bottom: -10px; margin-top: 5px; font-size: 1.2rem; animation: recordPulse 1.5s infinite; letter-spacing: 1px; }
        
        .game-over-title { color: #FF3F34; text-shadow: 0 0 15px #FF3F34; font-family: 'Orbitron', sans-serif; font-size: 2.2rem; margin-top: 5px; }
        .game-over-score { font-size: 3.5rem; color: #1DB6F2; text-shadow: 0 0 10px #FF3F34; font-weight: bold; line-height: 1; }

        #action-btn { position: absolute; bottom: 40px; left: 20px; width: 75px; height: 75px; background: rgba(29, 182, 242, 0.3); border: 3px solid #1DB6F2; border-radius: 50%; color: #1DB6F2; display: flex; justify-content: center; align-items: center; font-weight: bold; pointer-events: auto; visibility: hidden; z-index: 25; user-select: none; font-size: 0.85rem; backdrop-filter: blur(5px); box-shadow: 0 0 10px #1DB6F2; }
        #dash-btn { position: absolute; bottom: 100px; left: 20px; width: 75px; height: 75px; background: rgba(3, 166, 166, 0.3); border: 3px solid #03A6A6; border-radius: 50%; color: #03A6A6; display: flex; justify-content: center; align-items: center; font-weight: bold; pointer-events: auto; z-index: 25; user-select: none; font-size: 2rem; backdrop-filter: blur(5px); box-shadow: 0 0 10px #03A6A6; }
        .dash-cooldown { opacity: 0.3; border-color: #555 !important; color: #555 !important; }
        
        #error-log { position: absolute; top: 0; left: 0; color: #ff3333; background: rgba(0,0,0,0.9); z-index: 9999; padding: 10px; display: none; text-align: left; }

        table { margin-top: 10px; margin-bottom: 10px; border-collapse: collapse; width: 80%; max-width: 300px; color: white; border: 1px solid #1DB6F2; box-shadow: 0 0 10px #1DB6F2; }
        th, td { padding: 8px; border: 1px solid #1DB6F2; text-align: center; font-size: 1.1rem; }
        th { font-weight: bold; color: #1DB6F2; background: rgba(0,0,0,0.5); }

        /* Ocultar los botones de acción en computadoras (Pantallas anchas) */
        @media (min-width: 768px) {
            #dash-btn, #action-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="error-log"></div>

    <div id="game-container">
        <div class="hud">
            <div id="timer-display" style="font-size: 1.3rem;">10.0s</div>
            <div id="score-display" style="font-size: 1.3rem;">PESAS: 0</div>
            <div id="pause-btn-hud" onclick="pauseGame()">||</div>
        </div>

        <div id="start-screen" class="overlay">
            <h1 class="ellit-logo">POWER DASH</h1>
            <div id="tutorial-box"></div>
            <button onclick="startGame()">INICIAR PARTIDA</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
            <h1 class="ellit-logo">POWER DASH</h1>
            <div id="pause-menu-items" style="width: 100%;">
                <h2 class="pause-item" style="color: #1DB6F2; margin-bottom: 15px; font-family: 'Orbitron', sans-serif;">PAUSA</h2>
                
                <div class="slider-container pause-item">
                    <label>MÚSICA FONDO</label>
                    <input type="range" id="music-vol-slider" min="0" max="100">
                </div>
                
                <div class="slider-container pause-item">
                    <label>EFECTOS (SFX)</label>
                    <input type="range" id="sfx-vol-slider" min="0" max="100">
                </div>

                <button class="pause-item" onclick="resumeGame()">REANUDAR</button>
                <button class="pause-item" onclick="location.reload()">REINICIAR</button>
                <button class="pause-item btn-secondary" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
            </div>
        </div>

        <div id="dash-btn">⚡</div>
        <div id="action-btn">TOMAR</div>

        <div id="end-screen" class="overlay hidden">
            <h2 id="new-record-msg" class="hidden">¡NUEVO RÉCORD LOCAL!</h2>
            <h1 class="game-over-title">TIEMPO FUERA</h1>
            <div class="game-over-score" id="final-score">0</div>
            <p style="margin-top:5px; font-size: 1rem;">MANCUERNAS RESCATADAS</p>
            <h3 style="margin-top: 15px; margin-bottom: 5px; font-size: 1rem; color: #03A6A6;">MEJORES PUNTUACIONES</h3>
            <table id="leaderboard"></table>
            
            <button onclick="location.reload()">REINTENTAR</button>
            <button class="btn-secondary" onclick="window.location.href='index.html'">VOLVER AL MENÚ</button>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, line) {
            const log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML += `ERROR: ${msg} (Línea: ${line})<br>`;
            return false;
        };

        const ZONA_ENTREGA = { x: 400, y: 70, ancho: 220, alto: 135 };
        const mostrarColisiones = false; 
        const mostrarAreaRecogida = false;
        const RADIO_RECOGIDA = 40;        

        const colisionesMapa = [
            { id: 1,  ancho: 30, alto: 30, x: 50, y: 100 },
            { id: 2,  ancho: 100, alto: 100, x: 140, y: 170 },
            { id: 3,  ancho: 170, alto: 120, x: 400, y: 230 },
            { id: 4,  ancho: 160, alto: 100, x: 650, y: 170 },
            { id: 5,  ancho: 100, alto: 130, x: 227, y: 400 },
            { id: 6,  ancho: 100, alto: 200, x: 30, y: 400 },
            { id: 7,  ancho: 100, alto: 180, x: 575, y: 390 },
            { id: 8,  ancho: 30, alto: 60, x: 750, y: 480 },
            { id: 9,  ancho: 80, alto: 200, x: 127, y: 650 },
            { id: 10, ancho: 180, alto: 215, x: 403, y: 615 },
            { id: 11, ancho: 50, alto: 800, x: 795, y: 400 },
            { id: 12, ancho: 110, alto: 200, x: 690, y: 654 },
            { id: 13, ancho: 50, alto: 100, x: 50, y: 650 }, 
            { id: 14, ancho: 800, alto: 50, x: 400, y: 794 },
            { id: 15, ancho: 50, alto: 800, x: 8, y: 400 },
            { id: 16, ancho: 800, alto: 200, x: 400, y: -19 },
            { id: 17, ancho: 100, alto: 100, x: 70, y: 720 }
        ];

        let isNewRecord = false;

        function saveAndGetHighScores(newScore) {
            let scores = JSON.parse(localStorage.getItem('ellitRushTopScores')) || [];
            let maxScore = scores.length > 0 ? Math.max(...scores) : 0;
            
            if (newScore > 0 && newScore > maxScore) {
                isNewRecord = true;
            } else {
                isNewRecord = false;
            }

            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            localStorage.setItem('ellitRushTopScores', JSON.stringify(scores));
            return scores;
        }

        function displayLeaderboard(scores) {
            let html = "<tr><th>#</th><th>PUNTOS</th></tr>";
            scores.forEach((s, index) => { html += `<tr><td>${index + 1}</td><td><b>${s}</b></td></tr>`; });
            document.getElementById('leaderboard').innerHTML = html;
        }

        // === FUNCIÓN DE TUTORIAL ACTUALIZADA PARA IMÁGENES ===
        function setTutorialText() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const tutorialDiv = document.getElementById('tutorial-box');
            
            // Aquí está la ruta correcta a la carpeta img/
            const imageSrc = isMobile ? 'img/TUTOCEL.png' : 'img/TUTOCOM.png';
            
            tutorialDiv.innerHTML = `
                <img src="${imageSrc}" alt="Tutorial de Controles">
                <p id="tutorial-msg">¡Esquiva a los demás miembros y asegura todas las pesas en su lugar!</p>
            `;
        }
        setTutorialText();

        const WORLD_W = 800;
        const WORLD_H = 800;
        const C_CYAN = 0x1DB6F2;
        const C_GREEN = 0x03A6A6;
        const C_RED = 0xFF3F34;
        const C_GOLD = 0xFFD700; 

        let player, activeWeight, activeWeightGlow, machines, people, rackZone, pointerArrow, backgroundMap;
        let isHolding = null, isPlaying = false, timeLeft = 10.0, score = 0;
        let cursors, keyE, keySpace;
        let canDash = true, isDashing = false;
        let joyStick = null; 
        let gameInstance = null;
        let pickupDebug;

        let bgMusic = null;
        let sfxAgarrar, sfxDejar, sfxQuitar, sfxJiji;
        let sfxLoaded = false;
        
        let musicVol = localStorage.getItem('ellitRushMusicVol') !== null ? parseFloat(localStorage.getItem('ellitRushMusicVol')) : 0.05;
        let sfxVol = localStorage.getItem('ellitRushSfxVol') !== null ? parseFloat(localStorage.getItem('ellitRushSfxVol')) : 0.80;

        document.getElementById('music-vol-slider').value = musicVol * 100;
        document.getElementById('sfx-vol-slider').value = sfxVol * 100;

        document.getElementById('music-vol-slider').addEventListener('input', function(e) {
            musicVol = e.target.value / 100;
            localStorage.setItem('ellitRushMusicVol', musicVol);
            if (bgMusic) bgMusic.setVolume(musicVol);
        });

        document.getElementById('sfx-vol-slider').addEventListener('input', function(e) {
            sfxVol = e.target.value / 100;
            localStorage.setItem('ellitRushSfxVol', sfxVol);
        });

        function unlockAudio() {
            if (!gameInstance || !gameInstance.sound) return;
            const ctx = gameInstance.sound.context;
            if (ctx && ctx.state === 'suspended') {
                ctx.resume().then(() => {
                    try {
                        const buffer = ctx.createBuffer(1, 1, 22050);
                        const source = ctx.createBufferSource();
                        source.buffer = buffer;
                        source.connect(ctx.destination);
                        source.start(0);
                    } catch(e) {}
                });
            }
        }
        document.body.addEventListener('touchstart', unlockAudio, false);
        document.body.addEventListener('touchend',   unlockAudio, false);
        document.body.addEventListener('click',      unlockAudio, false);

        // === DETERMINAR EL TAMAÑO DE LA PANTALLA PARA PC O MÓVIL ===
        const isDesktopEnv = window.innerWidth >= 768;

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: isDesktopEnv ? 800 : 450, // 800px de ancho en PC muestra todo el mapa. 450px en móvil.
            height: 800, 
            backgroundColor: '#011C26',
            physics: { default: 'arcade', arcade: { debug: false } },
            audio: { disableWebAudio: false },
            scene: { preload: preload, create: create, update: update },
            plugins: {
                global: [{
                    key: 'rexVirtualJoystick',
                    plugin: rexvirtualjoystickplugin,
                    start: true
                }]
            }
        };

        try { gameInstance = new Phaser.Game(config); } catch(e) { console.error(e); }

        function preload() {
            this.load.image('gym_bg', 'fondo1.jpg'); 
            this.load.image('mancuerna', 'mancuerna1.png'); 

            for(let i = 1; i <= 6; i++) {
                this.load.audio('music' + i, 'sounds/' + i + 'C.mp3');
            }
            this.load.audio('agarrar', 'sounds/agarrar.mp3');
            this.load.audio('dejar', 'sounds/dejar.mp3');
            this.load.audio('quitar', 'sounds/quitar.mp3');
            this.load.audio('jiji', 'sounds/jiji.mp3');

            const g = this.make.graphics({ x: 0, y: 0, add: false });
            
            g.clear(); g.fillStyle(C_CYAN); g.fillCircle(15, 15, 15);
            g.fillStyle(0xffffff, 0.4); g.fillRect(15, 10, 12, 10); 
            g.lineStyle(2, 0xffffff); g.strokeCircle(15, 15, 15);
            g.generateTexture('player', 32, 32);
            
            g.clear(); g.fillStyle(0x0a0a0a); g.fillCircle(15, 15, 15);
            g.fillStyle(C_RED); g.fillCircle(22, 9, 3); g.fillCircle(22, 21, 3); 
            g.lineStyle(3, C_RED, 0.7); g.strokeCircle(15, 15, 15);
            g.generateTexture('person', 32, 32);

            g.clear(); 
            g.fillStyle(0xFFFF00, 1); 
            g.lineStyle(2, 0xFF9900); 
            g.beginPath(); 
            g.moveTo(20, 10); 
            g.lineTo(0, 0);   
            g.lineTo(0, 20);  
            g.closePath(); 
            g.fillPath();
            g.strokePath();
            g.generateTexture('arrow', 20, 20);

            g.clear(); 
            for (let i = 40; i > 0; i--) {
                g.fillStyle(C_GOLD, 0.05); 
                g.fillCircle(40, 40, i);
            }
            g.generateTexture('aura', 80, 80);
        }

        function showFloatingText(scene, x, y, msg, colorStr) {
            let t = scene.add.text(x, y, msg, { 
                fontSize: '20px', fontFamily: 'Orbitron', fontStyle: 'bold', 
                color: colorStr, stroke: '#000', strokeThickness: 4, align: 'center' 
            }).setOrigin(0.5).setDepth(200);
            
            scene.tweens.add({ 
                targets: t, y: y - 50, alpha: 0, duration: 1000, ease: 'Power2', 
                onComplete: () => t.destroy() 
            });
        }

        function create() {
            this.physics.world.setBounds(0, 0, WORLD_W, WORLD_H);
            
            backgroundMap = this.add.image(WORLD_W/2, WORLD_H/2, 'gym_bg');
            backgroundMap.setDisplaySize(WORLD_W, WORLD_H);
            backgroundMap.setDepth(-100);

            rackZone = this.add.rectangle(ZONA_ENTREGA.x, ZONA_ENTREGA.y, ZONA_ENTREGA.ancho, ZONA_ENTREGA.alto, C_GREEN, 0.2).setStrokeStyle(4, C_GREEN).setDepth(-10);
            this.physics.add.existing(rackZone, true);
            
            let rackText = this.add.text(ZONA_ENTREGA.x, ZONA_ENTREGA.y, "ZONA DE ENTREGA", { fontSize: '24px', color: '#03A6A6', fontStyle: 'bold', textShadow: '0 0 5px #03A6A6' }).setOrigin(0.5).setDepth(-9);
            
            if (!mostrarColisiones) {
                rackZone.setVisible(false);
                rackText.setVisible(false);
            }

            machines = this.physics.add.staticGroup();
            
            machines.add(this.add.rectangle(WORLD_W/2, 0, WORLD_W, 20).setVisible(false));
            machines.add(this.add.rectangle(WORLD_W/2, WORLD_H, WORLD_W, 20).setVisible(false));
            machines.add(this.add.rectangle(0, WORLD_H/2, 20, WORLD_H).setVisible(false));
            machines.add(this.add.rectangle(WORLD_W, WORLD_H/2, 20, WORLD_H).setVisible(false));

            colisionesMapa.forEach(col => {
                let rect = this.add.rectangle(col.x, col.y, col.ancho, col.alto, C_RED, 0.4);
                rect.setStrokeStyle(3, 0xFF0000); 
                rect.setDepth(5); 
                rect.setVisible(mostrarColisiones); 
                machines.add(rect);
            });

            player = this.physics.add.sprite(WORLD_W/2, WORLD_H/2, 'player').setCollideWorldBounds(true).setCircle(14).setDepth(10);
            player.body.setBounce(0);
            player.setPushable(false); 
            
            this.cameras.main.setBounds(0, 0, WORLD_W, WORLD_H);
            this.cameras.main.startFollow(player, true, 0.1, 0.1);

            pickupDebug = this.add.graphics().setDepth(100);
            pointerArrow = this.add.sprite(0, 0, 'arrow').setDepth(90).setVisible(false);

            activeWeightGlow = this.add.sprite(-100, -100, 'aura').setDepth(4);
            activeWeightGlow.setBlendMode(Phaser.BlendModes.ADD); 
            activeWeightGlow.setDisplaySize(60, 60); 

            activeWeight = this.physics.add.sprite(-100, -100, 'mancuerna').setDepth(5);
            activeWeight.setDisplaySize(40, 40); 
            
            spawnWeight();

            this.tweens.add({ targets: [activeWeight, activeWeightGlow], scale: '*=1.25', duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
            this.tweens.add({ targets: activeWeightGlow, alpha: { from: 1, to: 0.4 }, duration: 500, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

            people = this.physics.add.group();
            for(let i=0; i<4; i++) {
                let pos = getValidSpawn(true);
                let p = people.create(pos.x, pos.y, 'person');
                p.setCollideWorldBounds(true).setCircle(14).setDepth(9);
                p.body.setBounce(0); 
                p.body.setMass(1); 
            }

            this.physics.add.collider(player, machines);
            this.physics.add.collider(people, machines);
            
            this.physics.add.collider(people, people, (p1, p2) => {
                if (p1.body.velocity.length() < 10 && p2.body.velocity.length() < 10) {
                     p1.setVelocity(Phaser.Math.Between(-50, 50), Phaser.Math.Between(-50, 50));
                }
            });

            this.physics.add.collider(player, people, (pl, pe) => {
                if (isDashing) return;

                if (isHolding) {
                    isHolding = null;
                    timeLeft = Math.max(0, timeLeft - 2.5);
                    this.cameras.main.shake(200, 0.02);
                    
                    if(sfxQuitar) sfxQuitar.play({ volume: sfxVol });
                    
                    showFloatingText(this, player.x, player.y - 30, '-2.5s', '#FF3F34');
                    
                    spawnWeight();
                }
            });

            cursors = this.input.keyboard.createCursorKeys();
            keyE = this.input.keyboard.addKey('E');
            keySpace = this.input.keyboard.addKey('SPACE');

            setupJoystick(this);

            document.getElementById('action-btn').addEventListener('touchstart', (e) => { e.preventDefault(); tryPickup(); });
            document.getElementById('dash-btn').addEventListener('touchstart', (e) => { e.preventDefault(); triggerDash(); });
            keyE.on('down', tryPickup);
            keySpace.on('down', triggerDash);
            
            this.scene.pause();
        }

        function deliverWeight(scene) {
            score++; timeLeft += 4; 
            scene.cameras.main.flash(200, 0, 255, 0); 
            isHolding = null; 
            
            if(sfxDejar) sfxDejar.play({ volume: sfxVol });

            let emitter = scene.add.particles(player.x, player.y, 'aura', {
                speed: { min: 100, max: 250 },
                scale: { start: 0.5, end: 0 },
                alpha: { start: 0.8, end: 0 },
                blendMode: 'ADD',
                lifespan: 600
            });
            emitter.explode(20);

            showFloatingText(scene, player.x, player.y - 30, '+1 PESA\n+4.0s', '#00FF00');

            spawnWeight();
        }

        function isPointInRectangles(x, y) {
            for (let i = 0; i < colisionesMapa.length; i++) {
                let rect = colisionesMapa[i];
                let left = rect.x - (rect.ancho / 2);
                let right = rect.x + (rect.ancho / 2);
                let top = rect.y - (rect.alto / 2);
                let bottom = rect.y + (rect.alto / 2);

                if (x > left - 20 && x < right + 20 && y > top - 20 && y < bottom + 20) return true; 
            }
            return false; 
        }

        function getValidSpawn(checkPlayer = false) {
            let x, y, valid, loops = 0;
            do {
                valid = true;
                x = Phaser.Math.Between(50, WORLD_W-50); 
                y = Phaser.Math.Between(150, WORLD_H-50);
                
                if (y < 180 && x > 150 && x < 650) valid = false;
                if (checkPlayer && player && Phaser.Math.Distance.Between(x, y, player.x, player.y) < 200) valid = false;
                if (isPointInRectangles(x, y)) valid = false;

                loops++;
            } while (!valid && loops < 100); 
            return { x, y };
        }

        function spawnWeight() {
            let pos = getValidSpawn(true);
            activeWeight.setPosition(pos.x, pos.y);
            activeWeightGlow.setPosition(pos.x, pos.y);
        }

        function setupJoystick(scene) {
            const isMobile = !scene.sys.game.device.os.desktop;
            if (isMobile) {
                joyStick = scene.plugins.get('rexVirtualJoystick').add(scene, {
                    x: 350, y: 680, radius: 55,
                    base: scene.add.circle(0, 0, 55, 0xffffff, 0.1).setDepth(1000).setStrokeStyle(2, C_CYAN).setScrollFactor(0),
                    thumb: scene.add.circle(0, 0, 28, C_CYAN, 0.5).setDepth(1001).setScrollFactor(0),
                    dir: '8dir', forceMin: 10
                });
            }
        }

        function tryPickup() {
            if (!isPlaying) return;
            if (!isHolding && Phaser.Math.Distance.Between(player.x, player.y, activeWeight.x, activeWeight.y) < RADIO_RECOGIDA) {
                isHolding = activeWeight;
                if(sfxAgarrar) sfxAgarrar.play({ volume: sfxVol });
            }
        }

        function triggerDash() {
            if (!isPlaying || !canDash) return;
            canDash = false; isDashing = true;
            player.setTint(C_RED); 
            document.getElementById('dash-btn').classList.add('dash-cooldown');
            
            setTimeout(() => { isDashing = false; player.clearTint(); }, 250); 
            setTimeout(() => {
                canDash = true;
                if(player.active) { gameInstance.scene.scenes[0].tweens.add({ targets: player, alpha: 0.3, duration: 80, yoyo: true, repeat: 2 }); }
                document.getElementById('dash-btn').classList.remove('dash-cooldown');
            }, 3000); 
        }

        function pauseGame() {
            if (!isPlaying) return;
            isPlaying = false; 
            gameInstance.scene.scenes[0].scene.pause(); 
            
            const pauseScreen = document.getElementById('pause-screen');
            const pauseMenuItems = document.getElementById('pause-menu-items');
            
            pauseScreen.classList.remove('hidden');
            pauseMenuItems.classList.remove('animate-cascade');
            void pauseMenuItems.offsetWidth; 
            pauseMenuItems.classList.add('animate-cascade');
        }

        function resumeGame() {
            const pauseScreen = document.getElementById('pause-screen');
            pauseScreen.classList.add('hidden');
            
            gameInstance.scene.scenes[0].scene.resume(); 
            isPlaying = true; 
        }

        function update(time, delta) {
            if (!isPlaying) return;
            timeLeft -= delta / 1000;
            
            if (isDashing) {
                let trace = this.add.image(player.x, player.y, 'player');
                trace.setTint(C_GREEN); trace.setAlpha(0.4).setDepth(9);
                this.tweens.add({ targets: trace, alpha: 0, duration: 250, onComplete: () => trace.destroy() });
            }

            if (isHolding) {
                if (this.physics.overlap(player, rackZone)) { deliverWeight(this); } 
                else {
                    activeWeight.setPosition(player.x, player.y - 15);
                    activeWeightGlow.setPosition(player.x, player.y - 15); 
                }
            } else {
                activeWeightGlow.setPosition(activeWeight.x, activeWeight.y);
            }

            let target = isHolding ? {x: ZONA_ENTREGA.x, y: ZONA_ENTREGA.y} : {x: activeWeight.x, y: activeWeight.y};
            let distToTarget = Phaser.Math.Distance.Between(player.x, player.y, target.x, target.y);
            
            if (distToTarget > 200) { 
                pointerArrow.setVisible(true);
                pointerArrow.setPosition(player.x, player.y);
                pointerArrow.setRotation(Phaser.Math.Angle.Between(player.x, player.y, target.x, target.y));
                Phaser.Math.RotateAroundDistance(pointerArrow, player.x, player.y, pointerArrow.rotation, 65);
            } else {
                pointerArrow.setVisible(false);
            }

            let enemySpeed = Math.min(130 + (score * 4), 260); 
            let pSpeed = isDashing ? 650 : 250; 

            let vx = 0, vy = 0;
            if (cursors.left.isDown) vx = -pSpeed; else if (cursors.right.isDown) vx = pSpeed;
            if (cursors.up.isDown) vy = -pSpeed; else if (cursors.down.isDown) vy = pSpeed;

            if (joyStick && joyStick.force > 0) {
                vx = Math.cos(joyStick.rotation) * pSpeed;
                vy = Math.sin(joyStick.rotation) * pSpeed;
            }
            player.setVelocity(vx, vy);

            if (vx !== 0 || vy !== 0) {
                player.setRotation(Math.atan2(vy, vx));
            }

            people.children.iterate(p => {
                let d = Phaser.Math.Distance.Between(p.x, p.y, player.x, player.y);
                if (d < 34) { p.setVelocity(0, 0); } 
                else if (d < 300) { this.physics.moveToObject(p, player, isDashing ? 60 : enemySpeed); } 
                else { p.setVelocity(0, 0); }

                if (p.body.velocity.x !== 0 || p.body.velocity.y !== 0) {
                    p.setRotation(Math.atan2(p.body.velocity.y, p.body.velocity.x));
                }
            });

            document.getElementById('timer-display').innerText = Math.max(0, timeLeft).toFixed(1) + "s";
            document.getElementById('score-display').innerText = `PESAS: ${score}`;
            
            if (timeLeft <= 4) document.getElementById('timer-display').style.color = '#FF3F34'; 
            else document.getElementById('timer-display').style.color = '#ffffff';

            const btn = document.getElementById('action-btn');
            let isNear = Phaser.Math.Distance.Between(player.x, player.y, activeWeight.x, activeWeight.y) < RADIO_RECOGIDA;
            const isMobile = !this.sys.game.device.os.desktop;

            pickupDebug.clear();
            if (mostrarAreaRecogida && !isHolding) {
                pickupDebug.lineStyle(2, 0x00FF00, 0.8);
                pickupDebug.strokeCircle(activeWeight.x, activeWeight.y, RADIO_RECOGIDA);
            }

            if (isMobile) {
                btn.style.display = 'none'; 
                if (isNear && !isHolding) { tryPickup(); }
            } else {
                btn.style.visibility = (isNear && !isHolding) ? 'visible' : 'hidden';
            }

            if (timeLeft <= 0) gameOver();
        }

        function gameOver() {
            isPlaying = false;
            gameInstance.scene.scenes[0].scene.pause();
            
            if (bgMusic) bgMusic.pause();
            if (sfxJiji) sfxJiji.play({ volume: sfxVol });

            document.getElementById('pause-btn-hud').style.display = 'none';
            document.getElementById('final-score').innerText = score;
            
            let topScores = saveAndGetHighScores(score);
            displayLeaderboard(topScores);
            
            if (isNewRecord) {
                document.getElementById('new-record-msg').classList.remove('hidden');
            } else {
                document.getElementById('new-record-msg').classList.add('hidden');
            }

            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');
            endScreen.classList.remove('pop-in-anim');
            void endScreen.offsetWidth; 
            endScreen.classList.add('pop-in-anim');
        }

        function startGame() {
            if (!player || !activeWeight) return; 

            const startScreen = document.getElementById('start-screen');
            startScreen.classList.add('transition-out');

            unlockAudio();

            let scene = gameInstance.scene.scenes[0];
            if (!sfxLoaded) {
                sfxLoaded = true;
                if (scene.cache.audio.exists('agarrar')) sfxAgarrar = scene.sound.add('agarrar');
                if (scene.cache.audio.exists('dejar'))   sfxDejar   = scene.sound.add('dejar');
                if (scene.cache.audio.exists('quitar'))  sfxQuitar  = scene.sound.add('quitar');
                if (scene.cache.audio.exists('jiji'))    sfxJiji    = scene.sound.add('jiji');
            }
            
            if (bgMusic) bgMusic.stop(); 
            let randomTrackNumber = Phaser.Math.Between(1, 6);
            let trackKey = 'music' + randomTrackNumber;
            
            if (scene.cache.audio.exists(trackKey)) {
                bgMusic = scene.sound.add(trackKey, { loop: true, volume: musicVol });
                bgMusic.play();
            }

            setTimeout(() => {
                startScreen.classList.add('hidden');
                startScreen.classList.remove('transition-out');
                
                document.getElementById('pause-btn-hud').style.display = 'block';
                
                isPlaying = true; score = 0; timeLeft = 10.0;
                player.setPosition(WORLD_W/2, WORLD_H/2);
                spawnWeight();
                isHolding = null;
                canDash = true; isDashing = false;
                document.getElementById('dash-btn').classList.remove('dash-cooldown');
                
                gameInstance.scene.scenes[0].scene.resume();
                gameInstance.scene.scenes[0].cameras.main.fadeIn(500, 1, 28, 38);
            }, 450); 
        }
    </script>
</body>
</html>
