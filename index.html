<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Dash - Menú Principal</title>
    <style>
        /* =====================
           CSS: ESTÉTICA NEÓN "DEEP BLUE"
           ===================== */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: #011C26;
            background-repeat: no-repeat;
            /* Usamos 'center top' para asegurar que el logo incrustado no se corte por arriba */
            background-position: center top; 
            background-size: cover;
            overflow: hidden;
        }

        /* FONDO POR DEFECTO: Teléfonos (Vertical) */
        body {
            background-image: url("img/vertical.png");
        }

        /* FONDO PARA ESCRITORIO: Computadoras o Tablets acostadas (Horizontal) */
        @media (min-width: 768px) and (orientation: landscape) {
            body {
                background-image: url("img/horizontal1.png");
            }
        }

        /* Un overlay sutil para que los botones resalten sin tapar la imagen */
        .bg-overlay {
            position: absolute; inset: 0; z-index: 1;
            background: linear-gradient(to bottom, rgba(1, 28, 38, 0) 30%, rgba(1, 28, 38, 0.95) 100%);
            pointer-events: none;
        }

        /* ANIMACIONES */
        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes neonPulse {
            0% { box-shadow: 0 0 10px #1DB6F2, inset 0 0 5px #1DB6F2; }
            50% { box-shadow: 0 0 20px #1DB6F2, inset 0 0 10px #1DB6F2; }
            100% { box-shadow: 0 0 10px #1DB6F2, inset 0 0 5px #1DB6F2; }
        }

        /* CONTENEDOR DE BOTONES */
        .menu {
            position: absolute;
            top: 65%; /* Más abajo para no tapar el logo */
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
            padding: 0 20px;
            z-index: 5;
        }

        /* BOTONES EXACTAMENTE IGUALES A LOS DEL JUEGO */
        .menu button {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 900;
            color: white;
            background: rgba(3, 44, 166, 0.6); 
            border: 2px solid #1DB6F2; 
            border-radius: 6px; 
            cursor: pointer;
            box-shadow: 0 0 10px #1DB6F2; 
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .menu button:hover {
            background: rgba(3, 44, 166, 0.9);
            box-shadow: 0 0 25px #1DB6F2, inset 0 0 10px #1DB6F2;
            transform: scale(1.05);
        }

        .menu button:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px #1DB6F2;
        }

        /* Botón de Jugar con animación de pulso */
        .btn-play {
            animation: neonPulse 2s infinite;
        }

        /* PANELES (AJUSTES, CRÉDITOS, INFO) */
        .panel {
            position: absolute; inset: 0; 
            background: rgba(1, 28, 38, 0.9); 
            backdrop-filter: blur(12px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
            color: white; z-index: 10; text-align: center; padding: 20px; 
            border: 2px solid rgba(29, 182, 242, 0.3); 
        }
        
        .panel:not(.hidden) { animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .hidden { display: none !important; }

        .panel h2 { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 2.5rem; 
            color: #1DB6F2; 
            margin-bottom: 10px; 
            text-shadow: 0 0 15px #1DB6F2; 
        }

        .panel p { font-size: 1.1rem; line-height: 1.5; max-width: 500px; }

        /* BOTONES DENTRO DE LOS PANELES */
        .panel button {
            margin-top: 25px; padding: 14px 40px; font-size: 1rem; font-weight: bold;
            border-radius: 6px; border: 2px solid #03A6A6; cursor: pointer;
            background: rgba(3, 166, 166, 0.2); color: white;
            transition: all 0.2s; text-transform: uppercase;
        }
        .panel button:hover { background: rgba(3, 166, 166, 0.5); box-shadow: 0 0 15px #03A6A6; }
        .panel button:active { transform: scale(0.95); }

        /* SCROLL DE CRÉDITOS */
        .credits-container { 
            width: 100%; max-width: 400px; max-height: 50vh; overflow-y: auto; 
            padding: 20px; background: rgba(3, 166, 166, 0.1); 
            border-left: 4px solid #03A6A6; border-radius: 4px; text-align: left;
        }
        .credits-container::-webkit-scrollbar { width: 4px; }
        .credits-container::-webkit-scrollbar-thumb { background: #03A6A6; border-radius: 2px; }
        
        .role { font-size: 0.8rem; color: #03A6A6; letter-spacing: 2px; margin-bottom: 2px; text-transform: uppercase; font-weight: 700;}
        .name { font-size: 1.4rem; font-weight: 900; margin-bottom: 25px; color: white; }

        /* SLIDERS ESTILO NEÓN */
        .slider-container { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 20px; width: 100%; max-width: 300px; }
        .slider-container label { color: #1DB6F2; font-family: 'Orbitron', sans-serif; margin-bottom: 8px; font-size: 1rem; letter-spacing: 1px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; background: #fff; cursor: pointer; margin-top: -6px; border-radius: 50%; box-shadow: 0 0 10px #1DB6F2; border: 2px solid #1DB6F2; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: rgba(3, 166, 166, 0.3); border: 1px solid #1DB6F2; border-radius: 3px;}

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .menu { top: 70%; max-width: 250px; }
            .panel h2 { font-size: 2rem; }
        }
    </style>
</head>

<body>
    <div class="bg-overlay"></div>

    <div class="menu">
        <button class="btn-play" id="comenzarJuego">▶ JUGAR</button>
        <button onclick="abrirPanel('tiendaPanel')">🛒 TIENDA</button>
        <button onclick="abrirPanel('ajustesPanel')">⚙ AJUSTES</button>
        <button onclick="abrirPanel('creditosPanel')">ℹ CRÉDITOS</button>
    </div>

    <div id="ajustesPanel" class="panel hidden">
        <h2>AJUSTES</h2>
        
        <div class="slider-container">
            <label>MÚSICA FONDO</label>
            <input type="range" id="musicVolume" min="0" max="100">
        </div>

        <div class="slider-container">
            <label>EFECTOS (SFX)</label>
            <input type="range" id="sfxVolume" min="0" max="100">
        </div>

        <button onclick="cerrarPanel('ajustesPanel')">VOLVER</button>
    </div>

    <div id="creditosPanel" class="panel hidden">
        <h2>CRÉDITOS</h2>
        
        <div class="credits-container">
            <p class="role">Un Proyecto De</p>
            <p class="name">ELLIT</p>

            <p class="role">Dirección General (CompuX) y Diseño</p>
            <p class="name">Jesús Francisco Virrueta Espinoza</p>

            <p class="role">Diseño de Interfaz (UI/UX)</p>
            <p class="name">Brayan Castañeda</p>
            
            <p class="role">Tecnología de Motor</p>
            <p class="name" style="font-size: 1.2rem;">Phaser 3 Framework</p>
        </div>

        <button onclick="cerrarPanel('creditosPanel')">VOLVER</button>
    </div>

    <div id="tiendaPanel" class="panel hidden">
        <h2>TIENDA</h2>
        <p style="color: #a0d8f2; max-width: 350px;">Las mancuernas personalizadas y mejoras estarán disponibles pronto.</p>
        <br>
        <p style="color: #FFD700; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 3px; text-shadow: 0 0 10px #FFD700;">PRÓXIMAMENTE</p>
        <button onclick="cerrarPanel('tiendaPanel')" style="margin-top: 30px;">VOLVER</button>
    </div>

    <script>
        // =====================
        // MANEJO DE PANELES
        // =====================
        function abrirPanel(id) {
            if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(e=>console.log(e)); }
            document.getElementById(id).classList.remove("hidden");
        }

        function cerrarPanel(id) {
            if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(e=>console.log(e)); }
            document.getElementById(id).classList.add("hidden");
        }

        // =====================
        // 🎵 SISTEMA DE AUDIO (LOCAL STORAGE)
        // =====================
        const music = new Audio("sounds/Musica_Fondo.mp3");
        music.loop = true;
        const clickSound = new Audio("sounds/Click.mp3");

        let musicVol = localStorage.getItem('ellitRushMusicVol') !== null ? parseFloat(localStorage.getItem('ellitRushMusicVol')) : 0.05;
        let sfxVol = localStorage.getItem('ellitRushSfxVol') !== null ? parseFloat(localStorage.getItem('ellitRushSfxVol')) : 0.80;

        music.volume = musicVol;
        clickSound.volume = sfxVol;

        const musicSlider = document.getElementById("musicVolume");
        const sfxSlider = document.getElementById("sfxVolume");

        musicSlider.value = musicVol * 100;
        sfxSlider.value = sfxVol * 100;

        document.addEventListener("click", () => {
            if (music.paused) music.play().catch(e => console.log("Esperando interacción para audio"));
        }, { once: true });

        document.querySelectorAll("button").forEach(btn => {
            if(btn.id !== "comenzarJuego") {
                btn.addEventListener("click", () => {
                    clickSound.currentTime = 0;
                    clickSound.play().catch(e => console.log("Audio de click bloqueado"));
                });
            }
        });

        musicSlider.addEventListener("input", e => {
            let val = e.target.value / 100;
            music.volume = val;
            localStorage.setItem('ellitRushMusicVol', val);
        });

        sfxSlider.addEventListener("input", e => {
            let val = e.target.value / 100;
            clickSound.volume = val;
            localStorage.setItem('ellitRushSfxVol', val);
        });

        // =====================
        // INICIAR JUEGO
        // =====================
        document.getElementById("comenzarJuego").addEventListener("click", () => {
            clickSound.currentTime = 0; clickSound.play().catch(e=>console.log(e));
            
            document.body.style.opacity = 0;
            document.body.style.transition = "opacity 0.5s ease";
            
            setTimeout(() => {
                // REDIRIGE AL ARCHIVO DEL JUEGO
                window.location.href = "prueba.html"; 
            }, 500);
        });
    </script>
</body>
</html>
